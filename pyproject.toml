[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bend2"
version = "0.2.0.dev0"
description = "BEND 2.0 — benchmark the capabilities needed to design DNA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0 AND CC-BY-NC-4.0"
license-files = ["LICENSE", "docs/data.md"]
authors = [{name = "BEND 2.0 contributors"}]
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=17", "scipy>=1.13", "scikit-learn>=1.5", "filelock>=3.16"]

[project.optional-dependencies]
genome = ["py2bit>=1.0.1"]
huggingface = ["torch>=2.7", "transformers>=4.57,<5"]
dev = ["build>=1.2", "twine>=6", "pytest>=8", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/yhsure/genomic-bending/tree/benchmark"
Documentation = "https://github.com/yhsure/genomic-bending/blob/benchmark/docs/quickstart.md"
Issues = "https://github.com/yhsure/genomic-bending/issues"

[project.scripts]
bend2 = "bend2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bend2 = ["assets.json", "_data/*"]

[tool.pytest.ini_options]
testpaths = ["checks"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
