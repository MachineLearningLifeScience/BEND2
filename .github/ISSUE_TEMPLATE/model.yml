name: Submit a model without a pull request
description: Ask a maintainer to open your leaderboard submission PR.
title: "[Model] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to ask a maintainer to open the submission PR.
        Follow docs/submitting.md: evaluate, export, host the evidence ZIP, then run `bend2 submit` with its URL.
        You can submit results for any subset of tasks. Attach the generated JSON, which contains the scores.
  - type: textarea
    id: contribution
    attributes:
      label: Generated contribution JSON
      description: Attach the community-<identity>.json from bend2 submit, or link to it. GitHub may require renaming an attachment to .json.txt.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence download URL
      description: The public submission.zip download URL recorded in the JSON.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Review notes
      description: Explain known benchmark exposure, context limitations or other details a reviewer should know. The JSON already includes the model declaration and scores.
  - type: checkboxes
    id: permission
    attributes:
      label: Contribution
      options:
        - label: I would like a maintainer to open a leaderboard submission PR using this file.
          required: true
