name: Submit a model without a pull request
description: A maintainer can make the one-file leaderboard PR for you.
title: "[Model] "
body:
  - type: markdown
    attributes:
      value: |
        The usual submission is one generated JSON file in a pull request. This form is the no-Git alternative.
        Follow docs/submitting.md: evaluate, export, publish the evidence ZIP, then run `bend2 submit` with its URL.
        Partial task coverage is welcome. Please do not paste scores manually.
  - type: textarea
    id: contribution
    attributes:
      label: Generated contribution JSON
      description: Attach the community-<model>-<identity>.json from bend2 submit, or link to it. GitHub may require renaming an attachment to .json.txt.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence download URL
      description: The stable public submission.zip URL recorded in the JSON. No weights or embedding caches are needed.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Review notes
      description: Explain known benchmark exposure, context limitations or other details a reviewer should know. The JSON already includes the model declaration and scores.
  - type: checkboxes
    id: permission
    attributes:
      label: Contribution
      options:
        - label: I would like a maintainer to open a leaderboard submission PR using this file.
          required: true
