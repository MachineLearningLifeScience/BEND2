<g transform="translate(18,6)"><text class="base" x="14" y="24">A</text><text class="base accent" x="38" y="24">C</text><text class="base accent" x="78" y="24">T</text><text class="base" x="102" y="24">G</text><path class="signal" d="M51 18H64M60 14L64 18L60 22"/><g class="signal"><path d="M128 18H184"/><circle cx="184" cy="18" r="2.5"/></g><text class="base" x="14" y="54">G</text><text class="base accent" x="38" y="54">C</text><text class="base accent" x="78" y="54">T</text><text class="base" x="102" y="54">A</text><path class="signal" d="M51 48H64M60 44L64 48L60 52"/><g class="signal"><path d="M128 48H151"/><circle cx="151" cy="48" r="2.5"/></g></g>
