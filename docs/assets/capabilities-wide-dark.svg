<g transform="translate(18,6)"><text class="base" x="27" y="35">C</text><text class="base accent" x="76" y="35">T</text><path class="guide" d="M42 28H60M55 23L60 28L55 33"/><g class="muted"><path d="M106 21H145"/><circle cx="145" cy="21" r="2.5"/></g><g class="signal"><path d="M106 44H179"/><circle cx="179" cy="44" r="2.5"/></g></g>
<text class="label" x="120" y="109" text-anchor="middle">Functional prediction</text>
<text class="caption" x="120" y="138" text-anchor="middle">Predict an edit’s effect.</text>
</g>
