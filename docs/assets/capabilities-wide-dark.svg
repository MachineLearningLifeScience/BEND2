<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="166" viewBox="0 0 1200 166" role="img" aria-labelledby="title desc">
<title id="title">Five capabilities tested in BEND 2.0</title>
<desc id="desc">Recover hidden bases, predict edit effects, account for cell type and genetic background, and select DNA for a desired response. Conceptual diagrams, not benchmark measurements.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.base{text-anchor:middle;font-family:ui-monospace,monospace;font-size:20px;fill:#9ba9b2}
.guide,.muted{stroke:#53616a}.muted circle{fill:#53616a;stroke:none}
.accent{fill:var(--accent)}.signal,.cell{stroke:var(--accent)}
.signal circle,.nucleus{fill:var(--accent);stroke:none}.cell{fill:none;stroke-width:1.8}
.label{font-size:20px;font-weight:600}.caption{font-size:17px;fill:#9ba9b2}
</style>
<g style="--accent:#d6b063" transform="translate(0,0)">
